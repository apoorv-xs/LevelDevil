<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Social Media Meta Tags -->
    <meta property="og:title" content="Level Devil Portfolio">
    <meta property="og:description" content="Play my interactive portfolio game inspired by Level Devil.">
    <meta property="og:image" content="thumbnail.png">
    <meta property="og:url" content="https://level-devil-portfolio.com">
    <!-- Replace with actual URL if known, otherwise relative might verify poorly on some platforms but works for now -->
    <meta property="og:type" content="website">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Level Devil Portfolio">
    <meta name="twitter:description" content="Play my interactive portfolio game inspired by Level Devil.">
    <meta name="twitter:image" content="thumbnail.png">
    <title>Level Devil Portfolio</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <script src="babylon.min.js"></script>
    <script src="kaboom.js?v=2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Courier+Prime&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
        }

        #babylon-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            outline: none;
            touch-action: none;
            pointer-events: none;
            display: block;
        }

        /* --- HYBRID START SCREEN (User's "Older Version") --- */
        #start-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 250;
            cursor: pointer;
            transition: opacity 0.5s;
            user-select: none;
        }

        h1 {
            color: #fce566;
            font-family: 'Press Start 2P', monospace;
            font-size: 4rem;
            margin-bottom: 20px;
            text-shadow: 4px 4px #000;
            text-align: center;
        }

        p {
            color: #fff;
            font-family: 'Courier Prime', monospace;
            font-size: 1.5rem;
            animation: blink 1s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0;
            }
        }

        /* --- CANVAS (Transition & Game) --- */
        #game-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            pointer-events: none;
        }

        #game-canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
            pointer-events: auto;
            outline: none;
        }

        /* --- HUD & MODAL RESPONSIVE STYLING --- */
        #pause-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 150;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #fff;
            background-color: #000;
            border: 4px double #fff;
            padding: 8px 12px;
            cursor: pointer;
            user-select: none;
            display: none;
        }

        #audio-btn {
            position: fixed;
            top: 60px;
            left: 20px;
            z-index: 150;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            color: #fff;
            background-color: #000;
            border: 4px double #fff;
            padding: 8px 12px;
            cursor: pointer;
            user-select: none;
            display: none;
        }

        #pause-modal-overlay > div {
            width: min(400px, 85%) !important;
        }

        #project-modal-overlay > div {
            width: min(550px, 85%) !important;
        }

        @media (max-width: 600px) {
            #pause-btn {
                top: 10px;
                left: 10px;
                font-size: 10px;
                padding: 6px 10px;
            }
            #audio-btn {
                top: 45px;
                left: 10px;
                right: auto;
                font-size: 10px;
                padding: 6px 10px;
            }
        }
    </style>
</head>

<body>
    <!-- 1. HTML START OVERLAY -->
    <div id="start-overlay">
        <h1>START GAME</h1>
        <p>[ CLICK TO START ]</p>
    </div>

    <!-- BABYLON.JS 3D CANVAS (Hardware Accelerated AAA Layer) -->
    <canvas id="babylon-canvas"></canvas>

    <!-- 2. KABOOM CONTAINER (2D Physics & Input Layer) -->
    <div id="game-container">
        <canvas id="game-canvas" tabindex="0"></canvas>
    </div>

    <!-- DEBUG: ERROR HANDLER -->
    <script>
        window.onerror = function (msg, url, lineNo, columnNo, error) {
            const div = document.createElement("div");
            div.style.position = "fixed";
            div.style.top = "0";
            div.style.left = "0";
            div.style.width = "100%";
            div.style.backgroundColor = "red";
            div.style.color = "white";
            div.style.padding = "20px";
            div.style.zIndex = "9999";
            var displayMsg = "An error occurred: " + msg;
            if (url) {
                var filename = url.split('/').pop().split('?')[0];
                displayMsg += " (" + filename + ":" + lineNo + ")";
            }
            div.innerText = displayMsg;
            document.body.appendChild(div);
            return false;
        };
    </script>

    <!-- BABYLON.JS 3D ENGINE MODULES -->
    <script src="babylon_engine.js?v=1"></script>
    <script src="player_3d.js?v=1"></script>
    <script src="motion_graphics_bg.js?v=1"></script>
    <script src="level_intro_3d.js?v=1"></script>
    <script src="level_about_3d.js?v=1"></script>
    <script src="level_projects_3d.js?v=1"></script>
    <script src="level_contact_3d.js?v=1"></script>

    <!-- CORE GAME SCRIPTS -->
    <script src="sfx.js?v=14"></script>
    <script src="init.js?v=14"></script>
    <script src="player.js?v=14"></script>
    <script src="traps.js?v=14"></script>
    <script src="level_intro.js?v=14"></script>
    <script src="level_about.js?v=14"></script>
    <script src="level_projects.js?v=14"></script>
    <script src="level_contact.js?v=14"></script>

</body>

</html>
